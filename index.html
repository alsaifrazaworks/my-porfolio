<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       
       <title>Mohd Alsaif Raza - creative developer</title>

       <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--========navbar========-->
        <header class="navbar">
            <a href="#" class="logo">
            ALSAIF<span>.</span>
            </a>

        <nav>
            <a href="#work">work</a>
            <a href="#about">about</a>
            <a href="#services">services</a>
            <a href="#contact">contact</a>
        </nav>
        
        <a href="#contact-form" class="nav-button">  Let's Talk ↗ </a>

        <div class="contact-popup" id="contact-form">

            <div class="contact-box">
            
            <a href="#" class="close-btn">×</a>

            <h2>Let's work <em>Together</em></h2>

            <form>
                <div class="form-group">

                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                        >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        >
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your contact number"
                        required>
                </div>

                <div class="form-group">
                    <label for="project">Project Type</label>

                    <select 
                        id="project"
                        name="project"
                        required
                        >

                        <option value="">
                            Select a project
                        </option>

                        <option value="graphics-design">
                            Graphic Design
                        </option>

                        <option value="video-editing">
                            Video Editing
                        </option>

                        <option value="motion-design">
                            Motion Design
                        </option>

                        <option value="branding">
                            Branding
                        </option>
                    </select>
                </div>

                <!==message==>
                <div class="form-group">

                    <label for="message">
                        Tell me about your project 
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message"
                        required
                        ></textarea>
                </div>

                <button type="submit">Submit ↗</button>
            </form>
            </div>
        </div>
        </header>
        <!-- ================= HERO ================= -->

        <section class="hero">
            <div class="hero-top">
                <p class="eyebrow">
                    CREATIVE DESIGNER / MOTION ARTIST
                </p>
                <p class="hero-location">
                    Based in India <br>Available Worldwide
                </p>
            </div>
            <div class="hero-title">
                <h1>
                     I CREATE<br>
                     <span>VISUAL</span><br>
                     EXPERIENCES.
                </h1>
            </div>

            <div class="hero-bottom">
                <p>Graphic design, motion graphics and digital<br>
                   experiences designed to make brands impossible<br>
                   to ignore.
                </p>

                <a href="#work" class="arrow">
                    <span>↓</span>
                </a>
            </div>

            <div class="hero-shape shape-one"></div>
            <div class="hero-shape shape-two"></div>
        </section>


    </body>
</html>
